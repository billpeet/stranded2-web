server {
	listen 80;
	server_name _;
	root /usr/share/nginx/html;
	index index.html;

	gzip on;
	gzip_comp_level 5;
	gzip_min_length 1024;
	gzip_types text/plain text/css application/javascript application/json image/svg+xml image/bmp audio/wav application/octet-stream;

	location = /healthz {
		access_log off;
		default_type text/plain;
		return 200 "ok\n";
	}

	# Game data from the mounted volume: /game/manifest.json and /game/mod/...
	location /game/ {
		root /data;
		try_files $uri =404;
		add_header Cache-Control "public, max-age=3600";
	}

	# Hashed build output never changes.
	location /_app/immutable/ {
		try_files $uri =404;
		add_header Cache-Control "public, max-age=31536000, immutable";
	}

	# Single-page app: every other path is handled by the client.
	location / {
		try_files $uri $uri/ /index.html;
		add_header Cache-Control "no-cache";
	}
}
